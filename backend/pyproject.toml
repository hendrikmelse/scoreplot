[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "scorekeeper_webapp_backend"
version = "0.0.1"
authors = [
  { name="Hendrik Melse", email="hendrik.melse@yahoo.com" },
]
description = "Backend for my scorekeeper webapp"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]